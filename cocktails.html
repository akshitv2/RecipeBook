<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Gilded Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap"
          rel="stylesheet">
    <style>
        /* Update these styles in your <style> tag */

        .cocktail-card {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }

        /* Directional transition states */
        .slide-out-left {
            transform: translateX(-100%);
            opacity: 0;
        }

        .slide-out-right {
            transform: translateX(100%);
            opacity: 0;
        }

        .slide-in-prep-left {
            transform: translateX(100%);
            opacity: 0;
            transition: none;
        }

        .slide-in-prep-right {
            transform: translateX(-100%);
            opacity: 0;
            transition: none;
        }

        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --accent-color: #c5a059;
            --glass: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(197, 160, 89, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Page scroll is locked */
            height: 100vh;
            width: 100vw;
        }

        /* Logic for Catalogue detail view only */
        body.scroll-enabled {
            overflow-y: auto;
            height: auto;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            background: linear-gradient(to bottom, var(--bg-color) 60%, transparent);
        }

        .menu-trigger {
            font-size: 1.5rem;
            color: var(--accent-color);
            cursor: pointer;
        }

        .pantry-link {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-decoration: none;
            border: 1px solid var(--border-gold);
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* Views */
        .view {
            display: none;
            height: 100vh;
            width: 100%;
            padding: 100px 20px 40px 20px;
        }

        .view.active {
            display: block;
        }

        /* PANTRY SCROLL LOGIC */
        #view-pantry {
            overflow-y: auto; /* Internal scroll only */
            -webkit-overflow-scrolling: touch;
        }

        /* Catalogue Specifics */
        .image-wrapper {
            width: 100%;
            aspect-ratio: 3/4;
            border: 1px solid var(--border-gold);
            overflow: hidden;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cocktail-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-top: 20px;
        }

        .details-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .details-section.expanded {
            max-height: 3000px;
        }

        /* Pantry Grid */
        .ingredient-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            padding-bottom: 120px; /* Space for the save button */
        }

        .ingredient-card {
            background: var(--glass);
            padding: 18px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .ingredient-card.selected {
            border-color: var(--accent-color);
            background: rgba(197, 160, 89, 0.15);
            color: #fff;
        }

        /* Sticky Save Button in Pantry */
        .pantry-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
            z-index: 10;
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-color);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Sidebar & Controls */
        #sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 300px;
            height: 100%;
            background: #121212;
            z-index: 2000;
            transition: 0.4s;
            padding: 80px 30px;
        }

        #sidebar.open {
            left: 0;
        }

        .sidebar-item {
            list-style: none;
            padding: 15px 0;
            border-bottom: 1px solid var(--glass);
            font-family: 'Playfair Display', serif;
            cursor: pointer;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
            transition: 0.3s;
        }

        .controls.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 20px);
        }

        .nav-btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

<header>
    <div class="menu-trigger" onclick="toggleSidebar(true)">&#9776;</div>
    <div class="pantry-link" onclick="switchView('pantry')">My Pantry</div>
</header>

<nav id="sidebar">
    <div style="position:absolute; top:20px; right:20px; font-size:1.5rem" onclick="toggleSidebar(false)">&times;</div>
    <h2 style="font-family:'Playfair Display'; color:var(--accent-color); margin-bottom:20px">Menu</h2>
    <ul id="sidebar-list"></ul>
</nav>

<div id="view-catalogue" class="view active">
    <div id="main-content">
        <div class="cocktail-card" id="card">
            <div class="image-wrapper" onclick="toggleDetails(true)">
                <img src="" id="cocktail-img">
            </div>
            <div class="cocktail-name" id="cocktail-name"></div>
            <div style="font-size:0.7rem; color:var(--accent-color); letter-spacing:2px; margin-bottom:10px;"
                 id="cocktail-desc">TAP FOR RECIPE
            </div>
<!--            <div id="cocktail-desc" style="color:#999; margin-bottom:30px; line-height:1.6;"></div>-->
            <div class="details-section" id="details">
                <div style="padding: 20px 0;">
                    <div id="cocktail-ingredients-display"
                         style="font-style:italic; margin-bottom:15px; color:#ccc;"></div>
<!--                    <div id="cocktail-desc" style="color:#999; margin-bottom:30px; line-height:1.6;"></div>-->
                    <div id="recipe-container"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="empty-notice" style="display:none; text-align:center; padding-top:100px; color:#666;">No matches found.
    </div>
</div>

<div id="view-pantry" class="view">
    <h2 style="font-family:'Playfair Display'; font-size: 2rem;">Your Pantry</h2>
    <p style="color:#666; font-size:0.9rem;">What ingredients are you carrying?</p>

    <div class="ingredient-grid" id="ingredient-grid"></div>

    <div class="pantry-footer">
        <button class="save-btn" onclick="switchView('catalogue')">Apply Pantry</button>
    </div>
</div>

<div class="controls" id="nav-controls">
    <div class="nav-btn" onclick="changeCocktail(-1)">&#10094;</div>
    <div class="nav-btn" onclick="changeCocktail(1)">&#10095;</div>
</div>

<script>
    const DATA_URL = "cocktails/cocktails.json"; // Replace with your URL

    let allCocktails = [];
    let filteredList = [];
    let currentIndex = 0;
    let selectedIngredients = JSON.parse(sessionStorage.getItem('pantry')) || [];

    async function init() {
        try {
            const response = await fetch(DATA_URL);
            allCocktails = await response.json();
            initSidebar();
            initPantry();
            applyFilter();
            initImages();
        } catch (e) {
            console.error("Bar closed: Load error.");
        }
    }

    function initPantry() {
        const uniqueBases = [...new Set(allCocktails.flatMap(c => c.base))];
        const grid = document.getElementById('ingredient-grid');
        grid.innerHTML = uniqueBases.sort().map(ing => `
            <div class="ingredient-card ${selectedIngredients.includes(ing) ? 'selected' : ''}"
                 onclick="toggleIngredient('${ing}', this)">
                ${ing}
            </div>
        `).join('');
    }

    function switchView(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${view}`).classList.add('active');

        const controls = document.getElementById('nav-controls');
        if (view === 'catalogue') {
            applyFilter();
            controls.classList.remove('hidden');
            toggleDetails(false);
        } else {
            controls.classList.add('hidden');
            // Ensure pantry starts at top scroll
            document.getElementById('view-pantry').scrollTop = 0;
        }
    }

    function toggleDetails(open) {
        const details = document.getElementById('details');
        const controls = document.getElementById('nav-controls');
        if (open && !details.classList.contains('expanded')) {
            details.classList.add('expanded');
            controls.classList.add('hidden');
            document.body.classList.add('scroll-enabled'); // Main scroll ONLY for recipe
            history.pushState({view: 'details'}, '');
            setTimeout(() => window.scrollBy({top: 350, behavior: 'smooth'}), 300);
        } else {
            details.classList.remove('expanded');
            controls.classList.remove('hidden');
            document.body.classList.remove('scroll-enabled');
            window.scrollTo(0, 0);
        }
    }

    // Logic remaining from previous version
    function toggleIngredient(ing, el) {
        if (selectedIngredients.includes(ing)) {
            selectedIngredients = selectedIngredients.filter(i => i !== ing);
            el.classList.remove('selected');
        } else {
            selectedIngredients.push(ing);
            el.classList.add('selected');
        }
        sessionStorage.setItem('pantry', JSON.stringify(selectedIngredients));
    }

    function applyFilter() {
        filteredList = selectedIngredients.length === 0 ? [...allCocktails] :
            allCocktails.filter(c => c.base.every(ing => selectedIngredients.includes(ing)));
        currentIndex = 0;
        document.getElementById('main-content').style.display = filteredList.length ? 'block' : 'none';
        document.getElementById('empty-notice').style.display = filteredList.length ? 'none' : 'block';
        if (filteredList.length) updateDisplay();
    }

    // function updateDisplay() {
    //     const item = filteredList[currentIndex];
    //     const card = document.getElementById('card');
    //     card.classList.add('fade-out');
    //     document.getElementById('cocktail-img').src = item.image;
    //     setTimeout(() => {
    //         document.getElementById('cocktail-img').src = item.image;
    //         document.getElementById('cocktail-name').innerText = item.name;
    //         document.getElementById('cocktail-ingredients-display').innerText = item.ingredients;
    //         document.getElementById('cocktail-desc').innerText = item.desc;
    //         document.getElementById('recipe-container').innerHTML = item.recipe.map((r, i) =>
    //             `<div style="padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.9rem;">
    //                 <span style="color:var(--accent-color); margin-right:10px;">0${i+1}</span> ${r}
    //             </div>`).join('');
    //         card.classList.remove('fade-out');
    //     }, 5);
    // }

    function changeCocktail(dir) {
        if (filteredList.length <= 1) return;

        const card = document.getElementById('card');

        // 1. Determine exit direction
        const exitClass = dir > 0 ? 'slide-out-left' : 'slide-out-right';
        const entryPrepClass = dir > 0 ? 'slide-in-prep-left' : 'slide-in-prep-right';

        // 2. Slide current card out
        card.classList.add(exitClass);

        setTimeout(() => {
            // 3. Update index and content
            currentIndex = (currentIndex + dir + filteredList.length) % filteredList.length;
            toggleDetails(false);

            // Update data while card is invisible
            const item = filteredList[currentIndex];
            document.getElementById('cocktail-img').src = item.image;
            document.getElementById('cocktail-name').innerText = item.name;
            document.getElementById('cocktail-ingredients-display').innerText = item.ingredients;
            document.getElementById('cocktail-desc').innerText = item.desc;
            // document.getElementById('cocktail-desc-collapsed').innerText = item.desc;
            document.getElementById('recipe-container').innerHTML = item.recipe.map((r, i) =>
                `<div style="padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.9rem;">
                <span style="color:var(--accent-color); margin-right:10px;">0${i + 1}</span> ${r}
            </div>`).join('');

            // 4. Snap card to the "entry" side instantly
            card.classList.remove(exitClass);
            card.classList.add(entryPrepClass);

            // 5. Trigger reflow to ensure the 'prep' class is applied before sliding in
            void card.offsetWidth;

            // 6. Slide card back to center
            card.classList.remove(entryPrepClass);
        }, 400); // Matches CSS transition duration
    }

    // Remove the old updateDisplay() call inside changeCocktail and simplify updateDisplay
    function updateDisplay() {
        const item = filteredList[currentIndex];
        document.getElementById('cocktail-img').src = item.image;
        document.getElementById('cocktail-name').innerText = item.name;
        document.getElementById('cocktail-ingredients-display').innerText = item.ingredients;
        document.getElementById('cocktail-desc').innerText = item.desc;
        document.getElementById('recipe-container').innerHTML = item.recipe.map((r, i) =>
            `<div style="padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.9rem;">
            <span style="color:var(--accent-color); margin-right:10px;">0${i + 1}</span> ${r}
        </div>`).join('');
    }

    function initSidebar() {
        const list = document.getElementById('sidebar-list');
        list.innerHTML = allCocktails.map(c => `
            <li class="sidebar-item" onclick="jumpToCocktail('${c.name}')">${c.name}</li>
        `).join('');
    }

    function jumpToCocktail(name) {
        switchView('catalogue');
        const index = filteredList.findIndex(c => c.name === name);
        if (index !== -1) {
            currentIndex = index;
            updateDisplay();
        }
        toggleSidebar(false);
    }

    function toggleSidebar(open) {
        document.getElementById('sidebar').classList.toggle('open', open);
    }

    let startX = 0;
    document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
        if (document.body.classList.contains('scroll-enabled')) return;
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 60) changeCocktail(diff > 0 ? 1 : -1);
    });

    window.onpopstate = () => toggleDetails(false);
    init();

    function initImages() {
        const imagesToPreload = allCocktails.map(item => item.image);
        imagesToPreload.forEach(src => {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = src;
            document.head.appendChild(link);
        });
    }
</script>

</body>
</html>
