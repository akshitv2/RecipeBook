<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --primary: #10b981;
            --primary-dark: #059669;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 32px;
            font-size: 2.25rem;
        }

        /* --- Responsive Card Grid --- */
        .recipe-list {
            display: grid;
            gap: 20px;
        }

        .recipe-card {
            display: flex;
            flex-direction: column; /* Mobile first: vertical */
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #e2e8f0;
        }

        @media (min-width: 640px) {
            .recipe-card {
                flex-direction: row; /* Tablet/Desktop: horizontal */
                height: 180px;
            }
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        /* --- Image Fitting Logic --- */
        .card-img-container {
            width: 100%;
            aspect-ratio: 16 / 9; /* Wider on mobile */
            overflow: hidden;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .card-img-container {
                width: 180px;
                height: 100%;
                aspect-ratio: 1 / 1; /* Square on desktop */
            }
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image fills space without distortion */
            transition: var(--transition);
        }

        .recipe-card:hover .card-img {
            scale: 1.05;
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-info h2 {
            margin: 0 0 6px;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .meta-tag {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Detail View Refinement --- */
        #detail-view {
            position: fixed;
            inset: 0;
            background: var(--card-bg);
            z-index: 100;
            overflow-y: auto;
            display: none;
            transform: translateY(100%);
            transition: var(--transition);
        }

        #detail-view.active {
            display: block;
            transform: translateY(0);
        }

        .detail-hero-img {
            width: 100%;
            height: 50vh;
            object-fit: cover;
        }

        .detail-content {
            padding: 40px 20px;
            max-width: 650px;
            margin: 0 auto;
        }

        .detail-content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .detail-meta {
            color: var(--text-muted);
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .step-list {
            padding-left: 0;
            list-style: none;
            counter-reset: steps;
        }

        .step-list li {
            position: relative;
            margin-bottom: 20px;
            padding-left: 45px;
        }

        .step-list li::before {
            counter-increment: steps;
            content: counter(steps);
            position: absolute;
            left: 0;
            top: 0;
            width: 28px;
            height: 28px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid #e2e8f0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            z-index: 110;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="app">
    <h1>Culinara Recipes</h1>
    <div id="recipe-list" class="recipe-list"></div>
</div>

<div id="detail-view">
    <button class="back-btn" onclick="history.back()">←</button>
    <img id="detail-img" class="detail-hero-img" src="" alt="">
    <div class="detail-content">
        <h1 id="detail-name"></h1>
        <div id="detail-meta" class="detail-meta"></div>

        <h3 style="color: var(--primary)">Ingredients</h3>
        <ul id="detail-ingredients" style="margin-bottom: 40px;"></ul>

        <h3 style="color: var(--primary)">Preparation</h3>
        <ol id="detail-steps" class="step-list"></ol>
    </div>
</div>

<script>
    let recipeData = [];

    async function loadRecipes() {
        try {
            const response = await fetch('recipes.json');
            recipeData = await response.json();
            renderList(recipeData);
        } catch (err) {
            console.error("Fetch failed. Using fallback data for demonstration.", err);
        }
    }

    function renderList(data) {
        const list = document.getElementById('recipe-list');
        list.innerHTML = data.map(r => `
            <div class="recipe-card" onclick="openRecipe(${r.id})">
                <div class="card-img-container">
                    <img src="${r.image}" class="card-img" alt="${r.name}">
                </div>
                <div class="card-info">
                    <span class="meta-tag">${r.time}</span>
                    <h2>${r.name}</h2>
                    <p>${r.description}</p>
                </div>
            </div>
        `).join('');
    }

    function openRecipe(id) {
        const recipe = recipeData.find(r => r.id === id);
        if (!recipe) return;

        document.getElementById('detail-img').src = recipe.image;
        document.getElementById('detail-name').innerText = recipe.name;
        document.getElementById('detail-meta').innerText = `${recipe.time} • ${recipe.description}`;

        document.getElementById('detail-ingredients').innerHTML =
            recipe.ingredients.map(i => `<li style="margin-bottom: 8px;">${i}</li>`).join('');

        document.getElementById('detail-steps').innerHTML =
            recipe.recipe.map(step => `<li>${step}</li>`).join('');

        const detail = document.getElementById('detail-view');
        detail.style.display = 'block';
        setTimeout(() => detail.classList.add('active'), 10);

        window.history.pushState({view: 'detail'}, '');
    }

    function closeRecipe() {
        const detail = document.getElementById('detail-view');
        detail.classList.remove('active');
        setTimeout(() => detail.style.display = 'none', 400);
    }

    window.onpopstate = () => closeRecipe();

    loadRecipes();
</script>

</body>
</html>
