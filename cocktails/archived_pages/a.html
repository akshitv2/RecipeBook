<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Gilded Glass | Cocktail Catalogue</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --accent-color: #c5a059;
            --glass: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(197, 160, 89, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            touch-action: pan-y; /* Allows vertical scroll while JS handles horizontal swipe */
        }

        .catalogue-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 15px 120px 15px;
            min-height: 100vh;
        }

        header { text-align: center; padding: 15px 0; }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        /* Product Card */
        .cocktail-card { transition: opacity 0.3s ease; }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 3 / 4;
            border: 1px solid var(--border-gold);
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cocktail-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 20px 0 10px 0;
        }

        .tap-hint {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* Expandable Content */
        .details-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out;
        }

        .details-section.expanded { max-height: 1500px; }

        .content-inner {
            padding: 10px 0 40px 0;
            border-top: 1px solid var(--glass);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 25px 0 10px 0;
        }

        .ingredients { font-style: italic; color: #ccc; margin-bottom: 15px; line-height: 1.5; }
        .description { font-weight: 300; line-height: 1.7; color: #999; }

        /* Recipe List Styling */
        .recipe-list {
            list-style: none;
            padding: 0;
        }

        .recipe-step {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            display: flex;
            gap: 15px;
        }

        .step-num { color: var(--accent-color); font-weight: 600; }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 100;
        }

        .nav-btn {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .fade-out { opacity: 0; }
    </style>
</head>
<body>

<div class="catalogue-container" id="swipe-area">
    <header><h1>The Gilded Glass</h1></header>

    <div class="cocktail-card" id="card">
        <div class="image-wrapper" onclick="toggleDetails(true)">
            <img src="" id="cocktail-img" alt="Cocktail">
        </div>
        <div class="cocktail-name" id="cocktail-name"></div>
        <div class="tap-hint">Tap for recipe & details</div>

        <div class="details-section" id="details">
            <div class="content-inner">
                <div class="ingredients" id="cocktail-ingredients"></div>
                <div class="description" id="cocktail-desc"></div>

                <h3 class="section-title">The Preparation</h3>
                <div id="recipe-container" class="recipe-list"></div>
            </div>
        </div>
    </div>
</div>

<div class="controls">
    <div class="nav-btn" onclick="changeCocktail(-1)">&#10094;</div>
    <div class="nav-btn" onclick="changeCocktail(1)">&#10095;</div>
</div>

<script>
    const cocktails = [
    {
        "name": "Old Fashioned",
        "image": "https://images.unsplash.com/photo-1594901651181-5f442d7293f0?w=800",
        "ingredients": "Bourbon or Rye Whiskey, Sugar Cube, Angostura Bitters, Water, Orange Slice, Cherry",
        "desc": "A foundational whiskey cocktail that balances sweetness, bitterness, and spirit strength.",
        "recipe": [
            "Place a sugar cube in an old-fashioned glass and saturate with bitters and a few dashes of water.",
            "Muddle the sugar until dissolved.",
            "Fill the glass with ice cubes and add the whiskey.",
            "Stir gently and garnish with an orange slice and a cocktail cherry."
        ]
    },
    {
        "name": "Negroni",
        "image": "https://images.unsplash.com/photo-1573500881269-cc906666838d?w=800",
        "ingredients": "Gin, Campari, Sweet Red Vermouth, Orange Peel",
        "desc": "An iconic Italian aperitivo known for its vibrant red color and perfectly balanced bitter-sweet profile.",
        "recipe": [
            "Pour the gin, Campari, and sweet vermouth into an old-fashioned glass filled with ice.",
            "Stir gently for several seconds to combine and chill.",
            "Garnish with half an orange slice or an orange twist.",
            "Express the orange oils over the drink before serving."
        ]
    },
    {
        "name": "Dry Martini",
        "image": "https://images.unsplash.com/photo-1575037338588-bb36bd362475?w=800",
        "ingredients": "Gin, Dry Vermouth, Lemon Peel or Olive",
        "desc": "The quintessential sophisticated cocktail, highlighting the botanical profile of dry gin.",
        "recipe": [
            "Pour gin and dry vermouth into a mixing glass filled with ice cubes.",
            "Stir well until the exterior of the glass is very cold.",
            "Strain into a chilled martini glass.",
            "Garnish with a green olive or a twist of lemon peel."
        ]
    },
    {
        "name": "Manhattan",
        "image": "https://images.unsplash.com/photo-1533234458569-ce74358659bc?w=800",
        "ingredients": "Rye Whiskey, Sweet Red Vermouth, Angostura Bitters, Maraschino Cherry",
        "desc": "A smooth, spirit-forward classic that showcases the spice of rye whiskey tempered by herbal vermouth.",
        "recipe": [
            "Combine rye whiskey, sweet vermouth, and bitters in a mixing glass with ice.",
            "Stir until thoroughly chilled.",
            "Strain into a chilled coupe or cocktail glass.",
            "Garnish with a single maraschino cherry."
        ]
    },
    {
        "name": "Daiquiri",
        "image": "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=800",
        "ingredients": "White Rum, Fresh Lime Juice, Superfine Sugar",
        "desc": "A crisp, refreshing Cuban classic that relies on the perfect ratio of rum to citrus.",
        "recipe": [
            "Add sugar and fresh lime juice to a cocktail shaker and stir to dissolve the sugar.",
            "Add the white rum and fill the shaker with ice.",
            "Shake vigorously for about 15 seconds.",
            "Double strain into a chilled coupe or cocktail glass."
        ]
    },
    {
        "name": "Margarita",
        "image": "https://images.unsplash.com/photo-1536935338788-846bb9981813?w=800",
        "ingredients": "Tequila (100% Agave), Triple Sec, Fresh Lime Juice, Salt",
        "desc": "The most popular tequila cocktail in the world, balancing sour, sweet, and salty notes.",
        "recipe": [
            "Rub the rim of a chilled glass with a lime wedge and dip into salt.",
            "Add tequila, triple sec, and lime juice into a shaker with ice.",
            "Shake well until chilled.",
            "Strain into the salt-rimmed glass, either neat or over fresh ice."
        ]
    },
    {
        "name": "Espresso Martini",
        "image": "https://images.unsplash.com/photo-1545438102-799c3991ffb2?w=800",
        "ingredients": "Vodka, Coffee Liqueur, Fresh Espresso, Sugar Syrup, Coffee Beans",
        "desc": "A modern classic providing a cold, caffeinated kick with a signature frothy head.",
        "recipe": [
            "Brew a fresh shot of espresso and let it cool slightly.",
            "Add vodka, coffee liqueur, sugar syrup, and espresso into a shaker with plenty of ice.",
            "Shake hard to create the characteristic foam.",
            "Fine strain into a chilled martini glass and garnish with three coffee beans."
        ]
    },
    {
        "name": "Mojito",
        "image": "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=800",
        "ingredients": "White Rum, Fresh Lime Juice, Mint Sprigs, White Sugar, Soda Water",
        "desc": "A vibrant, minty highball that is a staple of Cuban cocktail culture.",
        "recipe": [
            "Muddle mint leaves with sugar and lime juice in the bottom of a highball glass.",
            "Add a splash of soda water and fill the glass with cracked ice.",
            "Pour in the rum and stir from the bottom up to incorporate ingredients.",
            "Top with more soda water and garnish with a large mint sprig."
        ]
    },
    {
        "name": "Whiskey Sour",
        "image": "https://images.unsplash.com/photo-1536935338788-846bb9981813?w=800",
        "ingredients": "Bourbon Whiskey, Fresh Lemon Juice, Simple Syrup, Egg White (optional)",
        "desc": "A rich, silky cocktail that balances the bite of bourbon with tart citrus.",
        "recipe": [
            "Combine bourbon, lemon juice, simple syrup, and egg white in a shaker.",
            "Perform a 'dry shake' without ice first to emulsify the egg white.",
            "Add ice and shake again until very cold.",
            "Strain into a chilled glass and garnish with a lemon wheel or cherry."
        ]
    },
    {
        "name": "Cosmopolitan",
        "image": "https://images.unsplash.com/photo-1578135805175-92576b50e39c?w=800",
        "ingredients": "Vodka Citron, Cointreau, Fresh Lime Juice, Cranberry Juice",
        "desc": "A stylish, tart-sweet cocktail made famous by modern pop culture.",
        "recipe": [
            "Add all ingredients into a cocktail shaker with ice.",
            "Shake vigorously for 10-15 seconds.",
            "Double strain into a large, chilled cocktail glass.",
            "Garnish with a lime wheel or a flamed orange zest."
        ]
    }
];

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    // 1. Swipe Functionality
    const swipeArea = document.getElementById('swipe-area');
    swipeArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    swipeArea.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) changeCocktail(1);
        if (touchEndX > touchStartX + threshold) changeCocktail(-1);
    }

    // 2. Back Gesture Handling
    window.onpopstate = function(event) {
        // If user hits back and details are open, close them
        const details = document.getElementById('details');
        if (details.classList.contains('expanded')) {
            toggleDetails(false);
        }
    };

    function toggleDetails(shouldOpen) {
        const details = document.getElementById('details');

        if (shouldOpen && !details.classList.contains('expanded')) {
            details.classList.add('expanded');
            // Push state so 'Back' closes the menu instead of leaving page
            history.pushState({view: 'details'}, '');
            setTimeout(() => window.scrollBy({ top: 300, behavior: 'smooth' }), 300);
        } else {
            details.classList.remove('expanded');
            // If user clicked manually, we might need to clear the pushed state
            if (history.state?.view === 'details') history.back();
        }
    }

    // 3. Render Logic
    function updateDisplay() {
        const card = document.getElementById('card');
        const item = cocktails[currentIndex];

        document.getElementById('details').classList.remove('expanded');
        card.classList.add('fade-out');

        setTimeout(() => {
            document.getElementById('cocktail-img').src = item.image;
            document.getElementById('cocktail-name').innerText = item.name;
            document.getElementById('cocktail-ingredients').innerText = item.ingredients;
            document.getElementById('cocktail-desc').innerText = item.desc;

            // Render Recipe Array
            const recipeContainer = document.getElementById('recipe-container');
            recipeContainer.innerHTML = item.recipe.map((step, idx) => `
                <div class="recipe-step">
                    <span class="step-num">${idx + 1}</span>
                    <span>${step}</span>
                </div>
            `).join('');

            card.classList.remove('fade-out');
        }, 300);
    }

    function changeCocktail(dir) {
        currentIndex = (currentIndex + dir + cocktails.length) % cocktails.length;
        updateDisplay();
    }

    // Initialize
    updateDisplay();
</script>

</body>
</html>
